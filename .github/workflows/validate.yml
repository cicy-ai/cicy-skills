name: Validate skills

# Runs on every PR and on push to v2 to catch broken manifests early.

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate every skill
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for d in skills/*/; do
            name=$(basename "$d")
            echo "::group::$name"
            if ! node tools/validate-skill.js "$d"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more skills failed validation"
            exit 1
          fi

      - name: Pack every skill (smoke test)
        shell: bash
        run: |
          set -euo pipefail
          for d in skills/*/; do
            node tools/pack-skill.js "$d" --out /tmp/dist >/dev/null
          done
          ls -la /tmp/dist
